<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 min-h-screen flex flex-col p-4">
    <!-- Header with Logo -->
    <header class="w-full max-w-6xl mx-auto mb-8">
        <div class="flex items-center p-4">
            <svg class="w-8 h-8" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient x1="0%" y1="32.443%" x2="104.18%" y2="50%" id="hlogo-a">
                        <stop stop-color="#FFF" stop-opacity=".299" offset="0%"></stop>
                        <stop stop-color="#7587E4" stop-opacity="0" offset="100%"></stop>
                    </linearGradient>
                    <linearGradient x1="18.591%" y1="0%" x2="100%" y2="100%" id="hlogo-b">
                        <stop stop-color="#818CF8" offset="0%"></stop>
                        <stop stop-color="#C7D2FE" offset="100%"></stop>
                    </linearGradient>
                </defs>
                <g fill="none" fill-rule="evenodd">
                    <path fill="#3730A3" d="M16 18.5V32l15.999-9.25V9.25z"></path>
                    <path fill="#4F46E5" d="m0 23 16 9V18.501L0 9.251z"></path>
                    <path fill-opacity=".64" fill="url(#hlogo-a)" d="M16 13 0 23l16 9 16-9z"></path>
                    <path fill="url(#hlogo-b)" d="M16 0 0 9.25l16 9.25 15.999-9.25z"></path>
                </g>
            </svg>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center">
        <div class="w-full max-w-md">
            <!-- Welcome Title -->
            <h1 class="text-4xl font-bold text-white mb-8 text-center">Welcome back!</h1>
            
            <!-- Login Form -->
            <div class=" rounded-lg p-6 shadow-lg">
                <!-- Email Input -->
                <div class="mb-4">
                    <label for="email" class="block text-gray-300 text-sm font-medium mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:indigo-primary focus:border-transparent"
                        placeholder=""
                    >
                    </div>
                
                <!-- Password Input -->
                <div class="mb-6">
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-gray-300 text-sm font-medium">Password</label>
                        <a href="change-password.html" class="text-sm text-blue-500">Forgot?</a>
                    </div>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-primary-500 focus:border-transparent"
                            placeholder=""
                        >
                    </div>
                    </div>
                
                <!-- Sign In Button -->
                <button id="signin-btn" class="w-full bg-indigo-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-md transition duration-300 flex items-center justify-center">
                    Sign In 
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="#7DD3FC">
                        <path fill-rule="evenodd" d="M10.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L12.586 11H5a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
                
                <!-- Or Separator -->
                <div class="flex items-center my-6">
                    <div class="flex-grow border-t border-gray-600"></div>
                    <span class="mx-4 text-gray-400 text-sm">Or</span>
                    <div class="flex-grow border-t border-gray-600"></div>
                </div>
                
                <!-- Google Sign In Button -->
                <button class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 px-4 rounded-md transition duration-300 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue With Google
                </button>
            </div>
            
            <!-- Sign Up Link -->
            <div class="mt-6 text-center text-gray-400">
                Don't you have an account? 
                <a href="#" class="text-blue-500 font-medium">Get Started</a>
            </div>
        </div>
    </main>
    
    <!-- Notification Toast -->
    <div id="notification" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg transform transition-transform duration-300 translate-y-20 opacity-0">
        <span id="notification-message"></span>
    </div>

    <script>
        // DOM Elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const signinBtn = document.getElementById('signin-btn');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');
        
        // Form validation
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        function validatePassword(password) {
            return password.length >= 8;
        }
        
        function showError(input, errorElement) {
            input.classList.add('');
            errorElement.classList.remove('hidden');
        }
        
        function hideError(input, errorElement) {
            input.classList.remove('');
            errorElement.classList.add('hidden');
        }
        
        function showNotification(message, isSuccess = true) {
            notificationMessage.textContent = message;
            notification.classList.remove('translate-y-20', 'opacity-0');
            notification.classList.add('translate-y-0', 'opacity-100');
            
            if (isSuccess) {
                notification.classList.add('');
                notification.classList.remove('');
            } else {
                notification.classList.add('');
                notification.classList.remove('');
            }
            
            setTimeout(() => {
                notification.classList.remove('translate-y-0', 'opacity-100');
                notification.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
        
        // Sign in form submission
        signinBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            // Validate email
            if (!emailInput.value || !validateEmail(emailInput.value)) {
                showError(emailInput, emailError);
                isValid = false;
            } else {
                hideError(emailInput, emailError);
            }
            
            // Validate password
            if (!passwordInput.value || !validatePassword(passwordInput.value)) {
                showError(passwordInput, passwordError);
                isValid = false;
            } else {
                hideError(passwordInput, passwordError);
            }
            
            if (isValid) {
                // Simulate loading state
                signinBtn.disabled = true;
                signinBtn.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Signing In...
                `;
                
                // Simulate API call
                setTimeout(() => {
                    signinBtn.disabled = false;
                    signinBtn.innerHTML = `
                        Sign In 
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L12.586 11H5a1 1 0 110-2h7.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    `;
                    showNotification('Login successful! Redirecting...', true);
                }, 1500);
            } else {
                showNotification('Please fill in all fields correctly', false);
            }
        });
    </script>
</body>
</html>
