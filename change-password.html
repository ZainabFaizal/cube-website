<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900 flex items-center flex flex-col p-4">
    
    <!-- Header with Logo -->
    <header class="w-full max-w-6xl mx-auto mb-8">
        <div class="flex items-center p-4">
            <svg class="w-8 h-8" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient x1="0%" y1="32.443%" x2="104.18%" y2="50%" id="hlogo-a">
                        <stop stop-color="#FFF" stop-opacity=".299" offset="0%"></stop>
                        <stop stop-color="#7587E4" stop-opacity="0" offset="100%"></stop>
                    </linearGradient>
                    <linearGradient x1="18.591%" y1="0%" x2="100%" y2="100%" id="hlogo-b">
                        <stop stop-color="#818CF8" offset="0%"></stop>
                        <stop stop-color="#C7D2FE" offset="100%"></stop>
                    </linearGradient>
                </defs>
                <g fill="none" fill-rule="evenodd">
                    <path fill="#3730A3" d="M16 18.5V32l15.999-9.25V9.25z"></path>
                    <path fill="#4F46E5" d="m0 23 16 9V18.501L0 9.251z"></path>
                    <path fill-opacity=".64" fill="url(#hlogo-a)" d="M16 13 0 23l16 9 16-9z"></path>
                    <path fill="url(#hlogo-b)" d="M16 0 0 9.25l16 9.25 15.999-9.25z"></path>
                </g>
            </svg>
        </div>
    </header>
    <div class="w-full max-w-md">
        <!-- Title -->
        <h1 class="text-4xl font-bold text-white text-center mb-8">Change your password</h1>
        
        <!-- Password Reset Form -->
        <form id="reset-form" class="space-y-6">
            <!-- Email Input -->
            <div>
                <label for="email" class="block text-white text-sm font-medium mb-2">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    class="w-full px-4 py-3 bg-white/10 backdrop-blur-sm border border-white/20 rounded-md text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:blue focus:border-transparent"
                    placeholder=""
                    required
                >
                 </div>
            
            <!-- Reset Password Button -->
            <button 
                type="submit" 
                id="reset-btn"
                class="w-full bg-indigo-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-md transition duration-300 flex items-center justify-center"
            >
                Reset Password →
            </button>
        </form>
        
    
    </div>
    
    <!-- Notification Toast -->
    <div id="notification" class="fixed bottom-4 right-4 bg-white text-gray-800 px-4 py-3 rounded-lg shadow-lg transform transition-transform duration-300 translate-y-20 opacity-0 flex items-center">
        <svg id="notification-icon" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="notification-message"></span>
    </div>

    <script>
        // DOM Elements
        const resetForm = document.getElementById('reset-form');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const resetBtn = document.getElementById('reset-btn');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');
        const notificationIcon = document.getElementById('notification-icon');
        
        // Form validation
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        function showError(input, errorElement) {
            input.classList.add('');
            errorElement.classList.remove('hidden');
        }
        
        function hideError(input, errorElement) {
            input.classList.remove('');
            errorElement.classList.add('hidden');
        }
        
        function showNotification(message, isSuccess = true) {
            notificationMessage.textContent = message;
            notification.classList.remove('translate-y-20', 'opacity-0');
            notification.classList.add('translate-y-0', 'opacity-100');
            
            if (isSuccess) {
                notification.classList.add('');
                notification.classList.remove('');
                notificationIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                `;
                notificationIcon.classList.add('');
                notificationIcon.classList.remove('');
            } else {
                notification.classList.add('');
                notification.classList.remove('');
                notificationIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                `;
                notificationIcon.classList.add('');
                notificationIcon.classList.remove('');
            }
            
            setTimeout(() => {
                notification.classList.remove('translate-y-0', 'opacity-100');
                notification.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
        
        // Form submission
        resetForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            let isValid = true;
            
            // Validate email
            if (!emailInput.value || !validateEmail(emailInput.value)) {
                showError(emailInput, emailError);
                isValid = false;
            } else {
                hideError(emailInput, emailError);
            }
            
            if (isValid) {
                // Simulate loading state
                resetBtn.disabled = true;
                resetBtn.innerHTML = `
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Processing...
                `;
                
                // Simulate API call
                setTimeout(() => {
                    resetBtn.disabled = false;
                    resetBtn.innerHTML = `Reset Password →`;
                    showNotification('Password reset link sent to your email!', true);
                    emailInput.value = ''; // Clear the input after successful submission
                }, 1500);
            } else {
                showNotification('Please enter a valid email address', false);
            }
        });
    </script>
</body>
</html>
